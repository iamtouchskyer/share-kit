<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>share-kit harness</title>
  </head>
  <body>
    <!--
      Test harness. Serves two purposes:
        1. exposes the real modules on window.SK so specs can drive them;
        2. builds a deterministic fixture whose geometry and colours are known,
           so the specs can assert *pixels* (gradient endpoints, ink coverage,
           left/right alignment) instead of just "a blob came back".
      Run with: node tests/server.js 8817  →  http://127.0.0.1:8817/tests/harness.html
    -->
    <div id="card-host"></div>
    <div id="fixture-fixtures"></div>

    <script type="module">
      import {
        createShareCard,
        exportToImage,
        renderNodeToPng,
        buildShareSvg,
        measureNode,
        getPresetSize,
        presets,
        isTooLong,
        SHARE_TOO_LONG,
        copyImageToClipboard,
        canCopyImage,
        copyToClipboard,
        downloadBlob,
        buildFilename,
      } from '../src/index.js';

      // 60×40 solid #d8463c PNG — proves message/article images make it into the
      // exported bitmap (an <img> in an isolated SVG document must be a data URI).
      const RED_PNG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADwAAAAoCAIAAAAt2Q6oAAAAPElEQVR42u3OMQ0AAAgDsAnjxv+JHFRwkDSpgGa63om0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tPSlBfpMrHWC4xU7AAAAAElFTkSuQmCC';

      function buildFixture() {
        const fixture = document.createElement('div');
        fixture.id = 'fixture';
        fixture.style.cssText = 'width:400px;margin:0;padding:0;background:#ffffff;'
          + 'font-family:-apple-system,Segoe UI,Roboto,sans-serif;';

        const bar = document.createElement('div');
        bar.id = 'fixture-bar';
        bar.style.cssText = 'height:4px;background:linear-gradient(90deg,#007aff,#5856d6)';
        fixture.appendChild(bar);

        const body = document.createElement('div');
        body.style.cssText = 'padding:20px';
        fixture.appendChild(body);

        const row = document.createElement('div');
        row.style.cssText = 'display:flex;justify-content:space-between;align-items:flex-start;gap:12px';
        body.appendChild(row);

        const left = document.createElement('p');
        left.id = 'fixture-left';
        left.style.cssText = 'margin:0;width:180px;font-size:13px;line-height:1.5;color:#1d1d1f';
        left.textContent = 'Left column copy for the alignment check.';
        row.appendChild(left);

        const bubble = document.createElement('div');
        bubble.id = 'fixture-bubble';
        bubble.style.cssText = 'width:180px;padding:10px 14px;border-radius:16px;background:#0071e3;'
          + 'color:#ffffff;font-size:13px;text-align:right;box-sizing:border-box';
        bubble.textContent = 'Right aligned bubble';
        row.appendChild(bubble);

        const images = document.createElement('div');
        images.style.cssText = 'display:flex;gap:8px;margin-top:12px';
        body.appendChild(images);

        const red = document.createElement('img');
        red.id = 'fixture-red';
        red.alt = 'red swatch';
        red.src = RED_PNG;
        red.style.cssText = 'width:60px;height:40px;display:block';
        images.appendChild(red);

        const broken = document.createElement('img');
        broken.id = 'fixture-broken';
        broken.alt = 'unreachable image';
        broken.src = '/missing.png';
        broken.style.cssText = 'width:60px;height:40px;display:block';
        images.appendChild(broken);

        // Bottom-most element: its colour proves nothing was clipped away.
        const probe = document.createElement('div');
        probe.id = 'fixture-probe';
        probe.style.cssText = 'height:40px;background:#00a86b';
        fixture.appendChild(probe);

        return fixture;
      }

      // A tall node for grow / clip / TOO_LONG cases.
      function buildTall(height = 1600) {
        const tall = document.createElement('div');
        tall.id = 'tall';
        tall.style.cssText = `width:300px;background:#ffffff;font-size:13px;color:#1d1d1f`;
        const top = document.createElement('div');
        top.style.cssText = 'height:24px;background:#111111';
        tall.appendChild(top);
        const mid = document.createElement('div');
        mid.style.cssText = `height:${height}px;background:#f5f5f7`;
        tall.appendChild(mid);
        const end = document.createElement('div');
        end.id = 'tall-probe';
        end.style.cssText = 'height:40px;background:#d8463c';
        tall.appendChild(end);
        return tall;
      }

      const host = document.getElementById('fixture-fixtures');
      const fixture = buildFixture();
      host.appendChild(fixture);
      const tall = buildTall();
      host.appendChild(tall);

      window.SK = {
        blobToBase64: (blob) => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        }),
        createShareCard,
        exportToImage,
        renderNodeToPng,
        buildShareSvg,
        measureNode,
        getPresetSize,
        presets,
        isTooLong,
        SHARE_TOO_LONG,
        copyImageToClipboard,
        canCopyImage,
        copyToClipboard,
        downloadBlob,
        buildFilename,
        fixture,
        tall,
      };
      window.SK_READY = true;
    </script>
  </body>
</html>
