name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: js (playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # The suite asserts pixels; keep the rendered evidence when it fails.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: share-kit-screenshots
          path: tests/__screenshots__
          if-no-files-found: ignore

  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
        working-directory: python
      - run: pytest -q
        working-directory: python
