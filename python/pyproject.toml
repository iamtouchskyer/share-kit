[project]
name = "share-kit"
version = "0.2.0"
description = "Reusable share + referral backend for FastAPI — DB-agnostic"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.100", "pydantic>=2.0"]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["share_kit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
