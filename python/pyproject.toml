[project]
name = "suri-share-kit"
version = "0.1.0"
description = "Reusable share + referral backend for FastAPI"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.100", "pydantic>=2.0"]
license = {text = "MIT"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["suri_share_kit"]
